name: Release

# Push a tag like v1.0.1: builds tachyon.exe (MinGW, with icon and version info), zips it as
# Tachyon_<tag>.zip with README.txt and the licences, packs the Claude Desktop extension
# tachyon-<version>-windows-x64.mcpb, records SHA256SUMS.txt and a signed
# build-provenance attestation (gh attestation verify), and attaches them to a GitHub release.
# The release text is the tag's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: MinGW and zip
        # v1.0.0's first run hung here for good; now it gives up and can be re-run
        timeout-minutes: 8
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends mingw-w64 zip
      - name: Tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo version $v"; exit 1; }
      - run: cargo test --release --locked
        timeout-minutes: 10
      - run: cargo build --release --target x86_64-pc-windows-gnu --locked
        timeout-minutes: 10
      - name: Package
        run: |
          mkdir -p out/Tachyon
          cp target/x86_64-pc-windows-gnu/release/tachyon.exe out/tachyon.exe
          cp target/x86_64-pc-windows-gnu/release/tachyon.exe out/Tachyon/
          cp packaging/README.txt LICENSE-MIT LICENSE-APACHE out/Tachyon/
          (cd out && zip -r -X "Tachyon_${GITHUB_REF_NAME}.zip" Tachyon)
          # Claude Desktop extension: tachyon.exe mcp with its manifest (packaging/mcpb)
          V="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version packaging/mcpb/manifest.json)" = "$V" || { echo "packaging/mcpb/manifest.json is not $V"; exit 1; }
          mkdir -p out/mcpb/server
          cp packaging/mcpb/manifest.json packaging/mcpb/icon.png packaging/mcpb/.mcpbignore LICENSE-MIT LICENSE-APACHE out/mcpb/
          cp out/tachyon.exe out/mcpb/server/tachyon.exe
          npx --yes @anthropic-ai/mcpb@2.1.2 validate out/mcpb/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack out/mcpb "out/tachyon-$V-windows-x64.mcpb"
          (cd out && sha256sum tachyon.exe "Tachyon_${GITHUB_REF_NAME}.zip" "tachyon-$V-windows-x64.mcpb" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v t="## ${GITHUB_REF_NAME}" '$0==t || index($0, t " ")==1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > out/notes.md
          test -s out/notes.md || echo "Tachyon ${GITHUB_REF_NAME}" > out/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/tachyon.exe
            out/Tachyon_${{ github.ref_name }}.zip
            out/tachyon-*-windows-x64.mcpb
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Tachyon ${{ github.ref_name }}
          body_path: out/notes.md
          files: |
            out/tachyon.exe
            out/Tachyon_${{ github.ref_name }}.zip
            out/tachyon-*-windows-x64.mcpb
            out/SHA256SUMS.txt
