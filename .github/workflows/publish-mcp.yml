name: Publish to MCP Registry

# Publishes packaging/mcp/server.json to the official MCP Registry as io.github.formray/tachyon,
# pointing at the .mcpb attached to an existing GitHub release. Manual only (Actions > Run
# workflow): it never runs on a tag or a release by itself.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose .mcpb to publish, e.g. v1.0.1"
        required: true
      dry_run:
        description: "Only fill and validate server.json, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # GitHub OIDC login for the io.github.formray namespace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher 1.8.4 (checksum pinned)
        run: |
          curl -fsSL -o mcp-publisher.tgz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz"
          echo "5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628  mcp-publisher.tgz" | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher
      - name: Fill version, URL and hash from the release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG"; exit 1; }
          V="${TAG#v}"
          F="tachyon-$V-windows-x64.mcpb"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "$F" -p SHA256SUMS.txt
          grep " $F\$" SHA256SUMS.txt | sha256sum -c -
          SHA=$(sha256sum "$F" | cut -d' ' -f1)
          jq --arg v "$V" --arg sha "$SHA" --arg url "https://github.com/formray/tachyon/releases/download/$TAG/$F" \
            '.version=$v | .packages[0].version=$v | .packages[0].identifier=$url | .packages[0].fileSha256=$sha' \
            packaging/mcp/server.json > server.json
          cat server.json
      - run: ./mcp-publisher validate server.json
      - if: ${{ !inputs.dry_run }}
        run: ./mcp-publisher login github-oidc
      - if: ${{ !inputs.dry_run }}
        run: ./mcp-publisher publish server.json
