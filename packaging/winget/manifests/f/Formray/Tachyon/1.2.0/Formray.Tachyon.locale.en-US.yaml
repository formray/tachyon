ShortDescription: Lightweight, read-only NVIDIA GPU monitor that explains what the GPU is doing.
Description: |-
  Tachyon shows how an NVIDIA graphics card is working, live: load, temperature, VRAM, power,
  clocks, video engines, PCIe and which programs use the GPU. It explains what is holding work
  back, warns before VRAM runs out, keeps a flight recorder for crash reports and a job history,
  and can answer local AI agents over MCP (off by default). No network access, no telemetry,
  no installer: a single portable exe.
