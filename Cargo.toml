[package]
name = "tachyon-gpu"
version = "1.1.0"
edition = "2024"
description = "The lightest real-time GPU monitor for Windows: a liquid-glass island for NVIDIA cards"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Giuseppe Albrizio <g.albrizio@gmail.com>"]
repository = "https://github.com/formray/tachyon"
homepage = "https://github.com/formray/tachyon"
keywords = ["nvidia", "gpu", "monitor", "nvml", "windows"]
categories = ["command-line-utilities", "hardware-support"]

[lib]
name = "tachyon"
path = "src/lib.rs"

[[bin]]
name = "tachyon"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25.17"

[target.'cfg(windows)'.dependencies]
# pure-Rust anti-aliased 2D rasteriser (BSD-3-Clause): no GDI+/Direct2D/D3D DLLs needed
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls",
    "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading",
    "Win32_System_ProcessStatus", "Win32_System_Kernel", "Win32_System_Console", "Win32_System_Registry",
    "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_DataExchange",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
# style choices of this codebase (flat Win32 code, plain config structs)
collapsible_if = "allow"
field_reassign_with_default = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

# dependencies at opt-level z: -140 KB (mostly tiny-skia); our per-pixel glass/Hex code stays at s.
# Measured under wine: no CPU difference (README).
[profile.release.package."*"]
opt-level = "z"
